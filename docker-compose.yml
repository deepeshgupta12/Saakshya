# For LATER (graduating off the laptop, SPEC §9 / §12) — DO NOT run during local-first.
# The local-first core uses DuckDB + plain scripts; this compose file documents the
# production-shaped services so the swap is a known quantity.
version: "3.9"

services:
  postgres:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_DB: saakshya
      POSTGRES_USER: saakshya
      POSTGRES_PASSWORD: change-me
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

volumes:
  pgdata:
